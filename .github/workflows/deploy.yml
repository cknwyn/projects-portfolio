name: Lint, Test & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Set permissions for GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # =============================================================
  # QUALITY GATE 1: JavaScript Linter & Syntax Verification
  # Runs automatically before any deployment can occur.
  # If any check fails, the pipeline halts immediately.
  # =============================================================
  lint:
    name: Quality Gate (JS Lint & Syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify JavaScript syntax (node --check)
        run: npm run lint:syntax

      - name: Run ESLint
        run: npm run lint

  # =============================================================
  # QUALITY GATE 2: Jest Automated Unit Testing
  # Validates critical portfolio functions and algorithms.
  # =============================================================
  test:
    name: Quality Gate (Jest Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Jest test suites
        run: npm test

  # =============================================================
  # DEPLOYMENT GATE: Deploy to GitHub Pages
  # STRICT PREREQUISITE: Only executes if BOTH 'lint' AND 'test' succeed!
  # =============================================================
  deploy:
    name: Deploy to GitHub Pages
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
